# =============================================================================
# config.yaml — Tarea 1: RAG normativo de contrataciones públicas del Perú
#
# TODA la configuración vive aquí: rutas, modelos, tamaños de chunk, umbrales,
# prompts y mensajes al usuario. Las credenciales NO: van solo en .env.
#
# Convenciones
#   - Las rutas son relativas a la carpeta que contiene este archivo (tarea1/).
#   - "PROVISIONAL (Fase N)": valor de arranque que se decide CON DATOS en esa
#     fase; el resultado se anota aquí y en el README con su tabla de evidencia.
# =============================================================================

paths:
  raw: data/raw                                  # PDFs originales: NUNCA se modifican
  manifest: data/raw/MANIFEST.json
  processed: data/processed                      # texto por página (JSON), versionado
  articulos_modificados: data/processed/articulos_modificados.json
  index: data/index                              # índice persistente (regenerable)
  index_cmp: data/index_cmp                      # índices temporales de las comparaciones (se borran y rehacen)
  eval_preguntas: eval/preguntas.csv
  eval_results: eval/results
  logs: logs
  llm_calls_log: logs/llm_calls.jsonl            # una línea por llamada al LLM
  cache_llm: eval/cache_llm                      # respuestas del LLM reutilizables SOLO en la evaluación de punta a punta (ignorada por git)
  pricing: pricing.yaml
  bot_db: data/bot.db                            # SQLite del bot (ignorada por git)
  docs: docs

# ── Fuentes oficiales (solo gob.pe / El Peruano) ─────────────────────────────
# "version" viaja como metadato de cada fragmento; "rol" alimenta el manejo de versiones.
# url = página oficial de la norma; url_pdf = enlace directo al PDF (verificado el 2026-09-21).
documentos:
  - id: ley_32069
    nombre: "Ley N.° 32069, Ley General de Contrataciones Públicas (versión actualizada al 19.07.2026)"
    nombre_corto: "Ley 32069"
    archivo: ley_32069.pdf
    url: https://www.gob.pe/institucion/osce/colecciones/45029-ley-n-32069-ley-general-de-contrataciones-publicas
    url_pdf: "https://cdn.www.gob.pe/uploads/document/file/9295551/6444155-ley-general-de-contrataciones-publicas-con-modificaciones-posteriores-hasta-el-19-07-2026.pdf?v=1787002595"
    version: ley_vigente
    rol: norma_base
    nota: >
      Compendio "versión actualizada" elaborado por el OECE (fuente base: SPIJ) e integrado con las
      modificatorias posteriores hasta el 19.07.2026. NO es el texto original publicado en El Peruano.
      Es lo único que la colección oficial del OECE ofrece para la Ley.
  - id: ds_009_2025_ef
    nombre: "Decreto Supremo N.° 009-2025-EF, Reglamento de la Ley N.° 32069"
    nombre_corto: "Reglamento (DS 009-2025-EF)"
    archivo: ds_009_2025_ef.pdf
    url: https://www.gob.pe/institucion/mef/normas-legales/6401561-009-2025-ef
    url_pdf: "https://cdn.www.gob.pe/uploads/document/file/7530416/6401561-ds009_2025ef.pdf?v=1737643286"
    version: reglamento_original_2025
    rol: reglamento
    nota: >
      PDF escaneado (sin capa de texto): requiere OCR. La página oficial también publica una fe de erratas
      (https://cdn.www.gob.pe/uploads/document/file/7577939/6401561-fe-de-erratas-del-ds-n-009-2025-ef.pdf)
      que NO se incluye en el corpus; se declara como limitación.
  - id: ds_001_2026_ef
    nombre: "Decreto Supremo N.° 001-2026-EF, modifica el Reglamento de la Ley N.° 32069"
    nombre_corto: "DS 001-2026-EF (modificatoria)"
    archivo: ds_001_2026_ef.pdf
    url: https://busquedas.elperuano.pe/dispositivo/NL/2474920-3
    url_pdf: "https://busquedas.elperuano.pe/api/archivo/file/4UFSj6jQKdnBeQxKkvTolN/*/2474920-3.PDF"
    version: modificatoria_2026-01
    rol: modificatoria
    modifica: ds_009_2025_ef
    nota: "Publicado en El Peruano el 08/01/2026 (según la ficha oficial de la norma)."

# ── Descarga (Fase 1) ────────────────────────────────────────────────────────
descarga:
  user_agent: "Mozilla/5.0 (compatible; tarea1-rag/1.0; +https://github.com/RenataZuta/Homework)"
  timeout_segundos: 60
  reintentos: 3                    # solo ante errores de red o 5xx/429; un 401/403 NO se reintenta
  espera_reintento_segundos: 2
  aviso_tamano_mb: 90              # GitHub rechaza archivos de más de 100 MB

# ── Extracción y OCR (Fase 2) ────────────────────────────────────────────────
extraccion:
  umbral_caracteres_ocr: 100       # DECIDIDO (Fase 2): páginas con capa de texto: mín 946 car. útiles; escaneadas: 0. Cualquier valor de 1 a 945 clasifica igual
  dpi: 200                         # DECIDIDO (Fase 2, 2026-09-21): más palabras correctas (620) sin omitir texto; ver eval/results/ocr_benchmark.md
  idioma_ocr: spa
  motor_ocr: tesseract             # DECIDIDO (Fase 2, 2026-09-21): 6.7x más rápido y ~2x más exacto que EasyOCR
  ocr:
    banda_cabecera: 0.10           # PROVISIONAL (Fase 2): fracción superior de la página que es cabecera (R1o)
  prioridad_ocr:                   # páginas a procesar PRIMERO (representativas por capítulo); el resto sigue en orden
    ds_009_2025_ef: [3, 4, 5, 6, 11, 15, 26, 28, 32, 33, 34, 37, 39, 40, 53, 54, 55, 56, 57, 58, 59, 60, 65, 67, 70, 73, 78, 81, 82, 94, 96, 97, 100]
  rangos_paginas:                  # páginas del PDF (base 1) a procesar; null = todas
    ley_32069: null
    ds_001_2026_ef: null
    ds_009_2025_ef: "3-7, 9-11, 13-21, 26-34, 36-48, 50-60, 62-65, 67-68, 70-71, 73-74, 76-82, 91-94, 96-98, 100"   # subconjunto de OCR: ver docs/ocr_subset.md
  codigo_fin_norma:                # el PDF de El Peruano arrastra texto de OTRAS normas tras este código (regla R3)
    ds_001_2026_ef: "2474920-3"
  mapeo:                           # paso de exploración de estructura del DS 009 (scripts/map_structure.py)
    motor: tesseract
    dpi: 200                       # el mapa a 96 DPI cubrió solo 71 % de los artículos; a 200 DPI se lee mejor
    palabras_clave:                # conteos por página, para priorizar contenido útil a una MYPE
      mype: ["mype", "micro y pequena", "microempresa", "pequena empresa"]
      contratacion_menor: ["contratacion menor", "hasta ocho", "8 uit", "ocho (8) uit", "contratos menores"]
      registro_proveedores: ["registro nacional de proveedores", "rnp", "inscripcion", "proveedor"]
      seleccion: ["procedimiento de seleccion", "subasta inversa", "licitacion publica", "concurso publico", "comparacion de precios"]
      garantias_penalidades: ["garantia", "penalidad", "adelanto", "pago", "resolucion del contrato"]
      controversias: ["arbitraje", "conciliacion", "junta de prevencion", "controversia", "recurso de apelacion"]
      pladicop: ["pladicop", "catalogo electronico", "acuerdo marco", "compra corporativa"]
  limpieza_demo:                   # páginas mostradas en docs/limpieza_encabezados.md (antes / después)
    ds_001_2026_ef: [2, 16]        # cabecera con "/" en línea aparte; p. 16 = fin de norma con texto ajeno
    ds_009_2025_ef: [60]           # página escaneada: cabecera por posición
  orden_lectura:                   # verificación del orden de lectura (scripts/reading_order_check.py)
    paginas: [60, 26, 100]         # 60 = cuerpo típico; 26 = capítulos y subcapítulo a media página; 100 = disposiciones transitorias numeradas
    recorte_desde: 0.10            # fracción superior del recorte (justo bajo la cabecera)
    recorte_hasta: 0.45
    max_lineas_mostradas: 40
    saltos_aceptables: 3           # más saltos I<->D que esto marca la página para revisión
  subconjunto:                     # selección de páginas del DS 009 para OCR (scripts/plan_ocr.py)
    paginas_minimo: 60             # requisito del proyecto
    paginas_objetivo: 75           # PROVISIONAL (Fase 2): se ajusta con el conteo de páginas obligatorias
    criterio_texto:                # página de texto normativo legible = AMBAS condiciones (medido en el mapa a 200 DPI)
      min_caracteres: 4500         # normativas: mín 4859; formularios del anexo: mediana 2188
      min_confianza: 80.0          # normativas: mín 80.3 (p. 21) y mediana 89; anexo: mediana 54.7
    max_articulo: 400              # las interpolaciones artículo->página no pasan de aquí
    pesos: {modificados: 10.0, mype: 1.0}   # puntaje = 10 × artículos modificados que empiezan en la página + densidad de palabras clave
  benchmark:                       # mini-benchmark de OCR (scripts/ocr_benchmark.py)
    documento: ds_009_2025_ef
    paginas: [10, 60, 100]         # páginas de TEXTO (inicio, medio y final del Reglamento): se promedian
    paginas_control: [150]         # formulario/tabla: se reporta aparte, NO entra en las medias
    variantes:
      - {motor: tesseract, dpi: 96}     # 96 = resolución nativa del escaneo
      - {motor: tesseract, dpi: 150}
      - {motor: tesseract, dpi: 200}
      - {motor: tesseract, dpi: 300}
      - {motor: easyocr, dpi: 200}   # 300 DPI se probó antes: no mejoraba y tardaba 47 s/pág

# ── Chunking (Fase 4) ────────────────────────────────────────────────────────
chunking:
  unidad: caracteres
  configuraciones:                 # se comparan con evaluation/compare_chunking.py
    - {nombre: c500_o50,   tamano: 500,  solapamiento: 50}
    - {nombre: c750_o100,  tamano: 750,  solapamiento: 100}
    - {nombre: c750_o100_sinctx, tamano: 750, solapamiento: 100, contexto_encabezado: false}    # ablación: sin encabezado de contexto
    - {nombre: c1000_o150, tamano: 1000, solapamiento: 150}
    - {nombre: c1500_o200, tamano: 1500, solapamiento: 200}
    - {nombre: c1000_o150_sinctx, tamano: 1000, solapamiento: 150, contexto_encabezado: false}   # ablación: sin encabezado de contexto
  activa: c750_o100                # DECIDIDO (Fase 4, 2026-09-21; provisional hasta validar el set): mayor Recall@3, ver eval/results/chunking_comparacion.md
  contexto_encabezado: true        # antepone al texto que se EMBEBE el último encabezado de artículo (aunque venga de la página anterior)
  articulo_maximo:                 # las menciones de artículo fuera de rango son errores de OCR ("Artículo 399") y se descartan
    ley: 100
    reglamento: 389

# ── Indexación (Fase 4) ──────────────────────────────────────────────────────
indexacion:
  coleccion: normas                # prefijo del nombre de la colección; se le añaden la config de chunking y un hash del modelo
  lote_upsert: 64                  # fragmentos por commit: una interrupción pierde a lo sumo un lote
  bins_histograma: 12

# ── Embeddings (Fases 4 y 6): cambiar de modelo = editar solo esta sección ───
embeddings:
  proveedor: local                 # local | openai | gemini
  batch: 32
  comparar: [local, openai, gemini]   # candidatos de evaluation/compare_embeddings.py (el motor usa solo 'proveedor')
  limites:                         # throttle y reintentos de los embeddings por API (mismo formato que llm.limites)
    rpm: 20                        # valor de diseño conservador; los límites reales se ven en https://aistudio.google.com/rate-limit
    reintentos: 4
    espera_inicial_s: 4
    factor_espera: 2
    espera_max_s: 60
    jitter: 0.25
  normalizar: true                 # vectores unitarios -> similitud coseno
  candidatos_locales:              # se comparan en evaluation/select_local_model.py (tarjetas verificadas el 2026-09-21)
    - {modelo: intfloat/multilingual-e5-small, prefijo_consulta: "query: ", prefijo_pasaje: "passage: "}
    - {modelo: intfloat/multilingual-e5-base, prefijo_consulta: "query: ", prefijo_pasaje: "passage: "}
    - {modelo: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2, prefijo_consulta: "", prefijo_pasaje: ""}
    - {modelo: BAAI/bge-m3, prefijo_consulta: "", prefijo_pasaje: ""}
  local:
    modelo: intfloat/multilingual-e5-small   # DECIDIDO (Fase 4): tarjeta verificada el 2026-09-21, ver docs/modelos_embeddings.md
    prefijo_consulta: "query: "              # la tarjeta del modelo exige estos prefijos
    prefijo_pasaje: "passage: "
    max_tokens: 512                          # informativo: la longitud REAL la lee el código del propio modelo; 0 fragmentos truncados
    dispositivo: cpu
  openai:
    modelo: text-embedding-3-small
    prefijo_consulta: ""
    prefijo_pasaje: ""
    max_tokens: 8192                         # verificado el 2026-09-21 en la guía oficial de embeddings; el precio está en pricing.yaml
  gemini:                                    # alternativa gratuita a OpenAI (verificada el 2026-09-21; ver PROGRESO.md)
    modelo: gemini-embedding-2               # el preview 'gemini-embedding-2-preview' se retiró el 2026-08-10
    env_clave: GEMINI_API_KEY
    url_base: https://generativelanguage.googleapis.com/v1beta
    nivel: gratuito                          # gratuito | pago (define el costo real; el precio de pago está en pricing.yaml)
    dimensiones: 768                         # la guía recomienda 768, 1536 o 3072 (3072 por defecto); 768 reduce el almacenamiento
    prefijo_consulta: "task: search result | query: "   # plantillas de la guía oficial (este modelo no usa task_type)
    prefijo_pasaje: "title: none | text: "
    max_tokens: 8192
    timeout_segundos: 60

# ── Recuperación (Fases 5 y 8) ───────────────────────────────────────────────
retrieval:
  modo: semantico                  # semantico | bm25 | hibrido — PROVISIONAL (Fase 8)
  bm25:                            # solo se usa con modo bm25 o hibrido (Fase 8)
    k1: 1.5                        # saturación de la frecuencia del término (valor clásico)
    b: 0.75                        # normalización por largo del fragmento (valor clásico)
    stemming: false                # true = stemmer ligero de plurales (se compara en compare_retrievers.py)
    usar_encabezado: true          # indexa «Artículo N. Título» + texto, como el contexto de los embeddings
  hibrido:
    rrf_k: 60                      # constante de Reciprocal Rank Fusion (valor de la publicación original)
    candidatos: 50                 # fragmentos de cada lista que entran a la fusión
  busqueda: exacta                 # exacta | aproximada. La aproximada (HNSW) dio resultados distintos entre procesos con este corpus: ver retrieval/semantic.py
  top_k: 5
  umbral_similitud: 0.835   # CALIBRADO con el LLM real (Fase 5, provisional hasta validar el set): ver eval/results/umbral_e2e_resumen.md
  umbral_calibrado: true          # pasa a true solo cuando existe el barrido en eval/results/
  versiones:
    activo: true                   # marcar fragmentos del Reglamento que mencionan artículos modificados y forzar los del DS 001
    max_fragmentos_forzados: 3        # fragmentos del DS 001 que se fuerzan cuando solo se recuperó el original
    max_originales_forzados: 2        # fragmentos del texto ORIGINAL que se fuerzan cuando solo se recuperó el DS 001

# ── Generación (Fase 5) ──────────────────────────────────────────────────────
llm:
  provider: gemini                 # gemini | anthropic. CAMBIO 2026-09-21: sin pagos adicionales -> capa gratuita de Google Gemini (Anthropic se conserva, sin usar)
  nivel: gratuito                  # gratuito | pago. Define el costo REAL (0 en la capa gratuita); el costo de REFERENCIA siempre usa el precio de pago
  max_tokens: 1024
  temperatura: 0.0                 # null = no enviarla
  timeout_segundos: 60
  limites:                         # throttle y reintentos (rag_engine/limites.py). rpm es un valor de DISEÑO conservador, NO el límite de Google:
    rpm: 10                        #   los límites reales de tu proyecto se ven en https://aistudio.google.com/rate-limit (no son públicos en la doc)
    reintentos: 4                  # reintentos ante 429 por tasa, 5xx o red (no ante clave inválida, formato o cuota DIARIA)
    espera_inicial_s: 4            # backoff exponencial: 4, 8, 16, 32 s (tope espera_max_s) + jitter; respeta el retryDelay que sugiera Google
    factor_espera: 2
    espera_max_s: 60
    jitter: 0.25                   # hasta +25 % de espera aleatoria para no sincronizar reintentos
  proveedores:
    gemini:
      modelo: gemini-3.5-flash-lite   # CORREGIDO 2026-09-21: la API respondió que gemini-2.5-flash-lite «ya no está disponible para usuarios nuevos». Ver PROGRESO.md
      env_clave: GEMINI_API_KEY
      url_base: https://generativelanguage.googleapis.com/v1beta
      campo_esquema: responseJsonSchema   # alternativa documentada: responseSchema
      temperatura: null                   # anula llm.temperatura: la guía de Gemini 3 recomienda dejar el valor por defecto (1.0); bajarlo puede degradar el resultado
      thinking_level: null                # null = no enviarlo (3.5 Flash-Lite razona por defecto en nivel «minimal»); valores documentados: minimal | low | medium | high
      thinking_budget: null               # solo para la familia 2.5; la 3.x usa thinking_level
    anthropic:                        # CONSERVADO, sin usar: Anthropic no tiene capa gratuita (nivel debe ser 'pago')
      modelo: claude-haiku-4-5-20251001
      env_clave: ANTHROPIC_API_KEY

# ── Precios: el detalle (con fuente y fecha) está en pricing.yaml ────────────
pricing:
  archivo: pricing.yaml

# ── Prompts (borrador; se valida y ajusta en la Fase 5) ──────────────────────
prompts:
  sistema: |
    Eres un asistente que responde preguntas sobre la normativa de contrataciones
    públicas del Perú, usando únicamente los documentos indexados.

    REGLAS OBLIGATORIAS
    1. Responde SOLO con el CONTEXTO recuperado. No uses conocimiento externo ni
       completes con suposiciones.
    2. Cita documento y página en cada afirmación, con el formato [documento, p. N].
    3. Cada fragmento del contexto viene etiquetado con su documento, versión y
       página. Si dos fragmentos se contradicen, PREVALECE el DS 001-2026-EF
       (versión modificatoria_2026-01) sobre el texto original del Reglamento.
       Nunca presentes como vigente un texto que el DS 001-2026-EF modificó.
    4. Si el contexto no alcanza para responder con seguridad, indica
       contexto_suficiente = false y NO inventes una respuesta.
    5. En la Ley 32069 algunas páginas traen una nota «(*) … cuyo texto es el
       siguiente» con el texto modificado o derogado: esa nota PREVALECE sobre el
       texto en cursiva que la precede.
    6. Responde en español claro, apto para el dueño de una micro o pequeña
       empresa. Esto es información normativa, no asesoría legal vinculante.
  usuario: |
    CONTEXTO
    {contexto}

    PREGUNTA
    {pregunta}
  herramienta_nombre: responder_con_citas
  herramienta_descripcion: >
    Entrega la respuesta a la pregunta usando solo el contexto, con las citas
    (documento y página) que la sustentan, e indica si el contexto fue suficiente.
  etiqueta_fragmento: "[{documento} | versión: {version} | p. {pagina}]"
  herramienta_campos:
    respuesta: "Respuesta a la pregunta, basada solo en el contexto, con la cita [documento, p. N] en cada afirmación."
    citas: "Documento y página de cada fragmento en que se apoya la respuesta."
    contexto_suficiente: "false si el contexto NO alcanza para responder con seguridad; true en caso contrario."

# ── Mensajes al usuario ──────────────────────────────────────────────────────
mensajes:
  abstencion: >
    No encontré información suficiente en los documentos indexados para responder
    con seguridad. Puede que la respuesta esté en una parte del Reglamento que no
    forma parte del índice, o que la pregunta esté fuera de la normativa de
    contrataciones públicas. Reformula la pregunta o consulta la norma oficial.
  error_cuota: "Se agotó la cuota gratuita del modelo de lenguaje. Intenta de nuevo en unos minutos (o mañana, si es la cuota diaria)."
  aviso_privacidad: >
    Privacidad: esta aplicación usa la capa gratuita de Google Gemini, y Google puede usar el contenido enviado para mejorar sus productos.
    Solo se envían tu pregunta y fragmentos de normas públicas. No escribas datos personales ni información confidencial.
  error_generico: "No se pudo generar la respuesta por un error del servicio. Intenta de nuevo en unos minutos."
  error_config: "Falta configuración necesaria. Revisa el README y tu archivo .env."
  indice_faltante: "No se encontró el índice en {ruta}. Constrúyelo antes de usar la app: python scripts/build_index.py"
  aviso_version: "El artículo {articulo} del Reglamento fue modificado por el DS 001-2026-EF ({detalle}); prevalece el texto de la modificatoria."
  limite_sesion: "Alcanzaste el máximo de consultas de esta sesión. Vuelve más tarde."
  limite_global: "Se alcanzó el tope diario de consultas de la demo pública. Vuelve mañana."
  bot:
    no_autorizado: "Este bot es de acceso restringido. Tu usuario no está autorizado."
    limite_excedido: "Llegaste al límite de {limite} consultas por día. Vuelve mañana."
    ayuda: >
      Soy un asistente sobre contrataciones públicas del Perú. Escríbeme tu pregunta
      y te respondo citando documento y página. Comandos: /fuente (fuentes de mi última
      respuesta), /costo (costo de tus consultas), /ayuda. Límite: {limite} consultas por día.
    sin_fuente: "Todavía no has hecho ninguna consulta."
    sin_costo: "Todavía no has hecho ninguna consulta."
    feedback_gracias: "¡Gracias por tu opinión!"
    backend_despertando: "Estoy despertando el servicio, puede tardar un momento. Te respondo apenas esté listo."

# ── Evaluación (Fases 3, 4, 6, 9) ────────────────────────────────────────────
eval:
  ks: [1, 3, 5]
  barrido_umbral:                  # calibración del umbral (evaluation/sweep_threshold.py)
    desde: 0.0
    hasta: 1.0
    paso: 0.005
    beta: 0.5                      # F-beta con beta < 1: la precisión pesa más que la cobertura (responder mal es peor que no responder)
  cache_llm: true                  # la evaluación de punta a punta reutiliza respuestas idénticas (no repite llamadas ni gasta cuota)
  set_validado: false              # pasa a true cuando la persona valida cada paginas_esperadas (Fase 3 [MANUAL]); mientras sea false, toda métrica se marca PROVISIONAL
  requisitos_set:                  # mínimos que exige el issue para el set de evaluación (validate_eval_set.py)
    in_domain: 15
    out_of_domain: 5
    modificadas_2026: 3            # preguntas sobre artículos afectados por el DS 001-2026-EF
    coloquiales: 5                 # redactadas como las haría el dueño de una MYPE
  min_recall_at_3: 0.85            # Fase 9. Real medido: Recall@3 = 0,905 (19 de 21). Con 21 preguntas cada una pesa 0,048: 0,85 exige 18 de 21 y tolera UNA pregunta
                                   #   más fallida (17/21 = 0,810 falla; 18/21 = 0,857 pasa). Provisional hasta validar el set (Fase 3)
  codigo_salida_fallo: 1           # exit code de run_eval.py si Recall@3 < mínimo (usa el CI)

# ── Bot de Telegram (Fases 10 y 11) ──────────────────────────────────────────
bot:
  modo: polling                    # polling (desarrollo local) | webhook (producción, Fase 11)
  limite_consultas_por_usuario_dia: 10
  zona_horaria_limite: America/Lima
  max_caracteres_mensaje: 4096     # verificado el 2026-09-21 en la referencia oficial de la Bot API: sendMessage admite 1-4096 caracteres

# ── Despliegue (Fases 11 y 12) ───────────────────────────────────────────────
deploy:
  topes:                           # protección de costo: la app pública usa mi clave
    consultas_por_sesion: 10
    consultas_globales_por_dia: 100
