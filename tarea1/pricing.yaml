# =============================================================================
# pricing.yaml — precios usados para calcular el costo de cada llamada
#
# Regla del proyecto: ningún precio se inventa. Cada bloque cita su fuente y la
# fecha en que se verificó. Si un precio es null, el código se niega a calcular
# costos con él (mejor un error que un costo falso).
#
# Estructura por VENTANAS HORARIAS: cada modelo tiene una lista de ventanas
# (zona horaria, hora de inicio, hora de fin, USD por millón de tokens). El
# costo de una llamada usa la ventana que contiene la hora de ESA llamada
# (llm/pricing.py :: precio_en). Esta estructura está probada con una tabla
# ficticia de horas pico y valle en tests/test_pricing.py.
# =============================================================================

anthropic:
  fuente: https://platform.claude.com/docs/en/about-claude/pricing
  fuente_modelos: https://platform.claude.com/docs/en/about-claude/models/overview
  fecha_verificacion: 2026-09-21
  moneda: USD
  unidad: por millón de tokens (MTok)
  nota_horarios: >
    La documentación oficial (verificada en la fecha indicada) publica UN precio por
    modelo y NO menciona tarifas distintas según la hora del día. Por eso cada modelo
    tiene una única ventana 00:00-24:00. Los únicos modificadores documentados son
    ajenos al horario y NO se aplican aquí: Batch API (-50 %), caché de prompts
    (lecturas al 0.1x) y residencia de datos inference_geo "us" (1.1x).
  modelos:
    claude-haiku-4-5-20251001:
      ventanas:
        - zona_horaria: America/Lima
          hora_inicio: "00:00"
          hora_fin: "24:00"
          usd_por_millon_entrada: 1.00
          usd_por_millon_salida: 5.00

# Embeddings por API (comparación de la Fase 6).
openai_embeddings:
  fuente: https://platform.openai.com/docs/pricing            # tabla «Prices per 1M tokens», grupo Embedding
  fuente_modelo: https://platform.openai.com/docs/guides/embeddings
  fecha_verificacion: 2026-09-21
  moneda: USD
  unidad: por millón de tokens de ENTRADA (los embeddings no tienen tokens de salida)
  verificacion_cruzada: >
    La guía oficial de embeddings indica 62 500 páginas por dólar a ~800 tokens por página = 50 M de tokens por dólar = USD 0,02 por millón,
    que coincide con la tabla de precios. La misma guía da 1536 dimensiones por defecto y 8192 tokens de entrada máxima.
  modelos:
    text-embedding-3-small:
      usd_por_millon_tokens: 0.02
      dimensiones: 1536
      max_tokens_entrada: 8192
