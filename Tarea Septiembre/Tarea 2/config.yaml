# =============================================================================
# config.yaml — Tarea 2: datos de contrataciones públicas (SEACE V3.0 / OCDS)
#
# TODA la configuración vive aquí: URLs, carpetas, meses, límites de la API y
# reglas de calidad. Ningún script tiene estos valores escritos en el código.
# Las rutas son relativas a la carpeta que contiene este archivo (Tarea 2/).
# =============================================================================

paths:
  raw: data/raw                       # ZIPs mensuales tal como los publica OECE (nunca se modifican)
  raw_extracted: data/raw/extracted   # CSV descomprimidos, una subcarpeta por mes
  api_cache: data/raw/api_cache       # respuestas de la API guardadas en disco (una por página / ocid)
  processed: data/processed
  outputs: data/outputs
  logs: logs
  # ── Fases 3-5 ──
  index: data/index                          # índice ChromaDB de descripciones de procesos (se regenera, no se versiona)
  eval_radar: eval/preguntas_radar.csv
  eval_radar_resultados: data/outputs/eval_radar_resultados.json
  umbral_barrido: data/outputs/barrido_umbral_radar.csv
  llm_calls_log: logs/llm_calls_radar.jsonl
  pricing: ../Tarea 1/pricing.yaml           # SE REUTILIZA la tabla de precios de la Tarea 1 (mismos modelos, misma fuente y fecha: ver ese archivo)
  riesgo_json: data/outputs/reporte_riesgo.json
  riesgo_md: data/outputs/reporte_riesgo.md

# ── Fuente oficial ───────────────────────────────────────────────────────────
# Patrón encontrado en el portal (endpoint /api/v1/files, que usa la página /descargas):
#   {base_url}/api/v1/file/{source}/{format}/{year}/{month}/
#   → devuelve un ZIP "YYYY-MM_seace_v3_csv.zip" con 22 CSV (records.csv, releases.csv y tablas hijas).
#   OJO: el mismo patrón con format=sha devuelve un SHA-256, pero lo comprobamos y es el del JSON
#   DESCOMPRIMIDO (2026-06_seace_v3.json), no el del ZIP CSV → no sirve para verificar el CSV.
#   Por eso la integridad se verifica con Content-Length + CRC interno del ZIP (ver bulk.verify_zip).
source:
  base_url: https://contratacionesabiertas.oece.gob.pe
  system: seace_v3                    # sistema de origen (SEACE V3.0)
  file_url_template: "{base_url}/api/v1/file/{system}/{fmt}/{year}/{month}/"
  files_index_url: "{base_url}/api/v1/files"
  records_url: "{base_url}/api/v1/records"
  record_by_ocid_url: "{base_url}/api/v1/record/{ocid}"
  # Tablas del ZIP mensual que usamos. "prefix" es la parte de la columna que se quita para dejar
  # nombres cortos: 'compiledRelease/parties/0/address/department' → 'address_department'.
  tables:
    records:          {file: records.csv,           prefix: null}
    releases:         {file: releases.csv,          prefix: null}
    parties:          {file: com_parties.csv,       prefix: "parties/0/"}
    tenderers:        {file: com_ten_tenderers.csv, prefix: "tenderers/0/"}
    awards:           {file: com_awards.csv,        prefix: "awards/0/"}
    award_suppliers:  {file: com_awa_suppliers.csv, prefix: "suppliers/0/"}
    contracts:        {file: com_contracts.csv,     prefix: "contracts/0/"}
    tender_documents: {file: com_ten_documents.csv, prefix: "documents/0/"}
    contract_documents: {file: com_con_documents.csv, prefix: "documents/0/"}

# ── Fase 1a: descarga masiva ─────────────────────────────────────────────────
# Se eligen meses COMPLETOS de 2026. Septiembre 2026 se excluye a propósito:
# el mes aún no termina y el archivo cambia a diario (no sería reproducible).
bulk:
  format: csv                         # "csv" (nombres de columna en inglés, OCDS) ; "csv_es" tiene los encabezados traducidos
  months:
    - "2026-06"
    - "2026-07"
    - "2026-08"
  verify_zip: true                    # comprueba tamaño = Content-Length y el CRC de cada CSV dentro del ZIP
  timeout_seconds: 300
  chunk_bytes: 1048576                # se escribe a disco de 1 MB en 1 MB (no carga el ZIP entero en memoria)
  download_log: logs/descargas.jsonl  # una línea JSON por intento de descarga

# ── Fase 1b: cliente de la API ───────────────────────────────────────────────
api:
  min_seconds_between_requests: 1.0   # rate limiting: como máximo ~1 petición por segundo
  max_retries: 5
  backoff_base_seconds: 2.0           # espera 2, 4, 8, 16, 32 s entre reintentos
  retry_on_status: [429, 500, 502, 503, 504]
  timeout_seconds: 60
  page_size: 20                       # "paginateBy" de /api/v1/records
  max_pages: 3                        # tope para la demostración (no queremos bajar todo el SEACE por API)
  request_log: logs/api_requests.jsonl
  pages_output: data/raw/api_cache/records_api_pages.jsonl   # records de --pages (la validación usa este archivo)
  ocid_output: data/raw/api_cache/records_api_ocid.jsonl     # records de --ocid
  user_agent: "UP-DataScience-Tarea2/1.0 (proyecto academico)"

# ── Fase 1c: normalización a una fila por ocid ───────────────────────────────
normalize:
  output_file: data/processed/procesos.parquet
  output_csv: data/processed/procesos_muestra.csv   # primeras filas, para mirar a ojo / versionar
  sample_rows: 200
  report_file: data/outputs/reporte_normalizacion.json
  # Cuando un mismo ocid aparece más de una vez en el archivo principal, nos quedamos
  # con la versión más reciente según esta columna (orden descendente).
  latest_by: date
  report_max_examples: 50            # cuántos ocid repetidos se listan en el reporte de normalización
  buyer_role: buyer                  # rol OCDS que identifica al comprador en parties.roles
  # Columnas de records.csv que se conservan → nombre corto en español.
  columns:
    ocid: ocid
    compiledRelease/date: fecha_compilacion
    compiledRelease/dataSegmentation/id: segmento_mes
    compiledRelease/tender/id: tender_id
    compiledRelease/tender/title: nomenclatura
    compiledRelease/tender/description: descripcion
    compiledRelease/tender/procurementMethod: metodo_ocds
    compiledRelease/tender/procurementMethodDetails: tipo_procedimiento
    compiledRelease/tender/mainProcurementCategory: categoria
    compiledRelease/tender/value/amount: monto_referencial
    compiledRelease/tender/value/currency: moneda
    compiledRelease/tender/value/amount_PEN: monto_referencial_pen
    compiledRelease/tender/datePublished: fecha_convocatoria
    compiledRelease/tender/numberOfTenderers: n_postores_declarado
    compiledRelease/tender/hasTenderInformationProtectedByLaw: info_protegida_por_ley
    compiledRelease/planning/budget/amount/amount: presupuesto
    compiledRelease/buyer/id: comprador_id
    compiledRelease/buyer/name: comprador_nombre
  numeric_columns: [monto_referencial, monto_referencial_pen, presupuesto, n_postores_declarado]

# ── Fase 2: validación y territorio ──────────────────────────────────────────
validation:
  input_file: data/processed/procesos.parquet
  output_file: data/processed/procesos_validados.parquet
  report_md: data/outputs/reporte_calidad.md
  report_json: data/outputs/reporte_calidad.json
  flagged_examples_per_rule: 5        # cuántos ocid de ejemplo se listan por regla en el reporte
  protected_by_law_value: "True"      # valor de info_protegida_por_ley que indica monto reservado por ley
  # Huellas de encoding roto: UTF-8 leído como Latin-1 (Ã, Â) o carácter de reemplazo (U+FFFD).
  mojibake_pattern: "Ã|Â|�"
  mojibake_columns: [descripcion, comprador_nombre, tipo_procedimiento, proveedores]
  # Códigos de documentType permitidos: lista oficial de OCDS 1.1 (codelist documentType).
  # Lo que no esté aquí se marca como "código no declarado" (regla OCP #3).
  ocds_document_types:
    - plannedProcurementNotice
    - tenderNotice
    - awardNotice
    - contractNotice
    - completionCertificate
    - procurementPlan
    - biddingDocuments
    - technicalSpecifications
    - evaluationCriteria
    - evaluationReports
    - contractDraft
    - contractSigned
    - contractArrangements
    - contractSchedule
    - physicalProgressReport
    - financialProgressReport
    - finalAudit
    - hearingNotice
    - marketStudies
    - eligibilityCriteria
    - clarifications
    - shortlistedFirms
    - environmentalImpact
    - assetAndLiabilityAssessment
    - riskProvisions
    - winningBid
    - complaints
    - contractAnnexe
    - contractGuarantees
    - subContract
    - needsAssessment
    - feasibilityStudy
    - projectPlan
    - billOfQuantity
    - bidders
    - conflictOfInterest
    - debarments
    - illustration
    - submissionDocuments
    - contractSummary
    - cancellationDetails

territory:
  mapping_file: config/departamentos.yaml   # regla explícita de mapeo (departamentos, alias, provincias)
  expected_departments: 25                  # 24 departamentos + Callao; el script falla si el YAML no tiene 25
  geojson_file: config/peru_departamentos.geojson   # polígonos para el mapa coroplético (Fase 4); fuente y fecha: ver config/FUENTES_GEO.md
  geojson_key: NOMBDEP                              # propiedad del GeoJSON con el nombre del departamento (coincide con los 25 valores de arriba)

# =============================================================================
# Fases 3-5 — RAG híbrido sobre procesos de contratación
#
# El motor (src/radar_engine/) REUTILIZA de la Tarea 1 (../Tarea 1/src/rag_engine/):
#   - embeddings (rag_engine.embeddings.*): el MISMO modelo local, mismo factory.
#   - llm (rag_engine.llm.*): mismos clientes (Gemini/Anthropic), mismo throttle/reintentos,
#     mismo log de costos y la MISMA tabla de precios (paths.pricing, arriba).
#   - retrieval.indice (abrir_cliente/crear_o_abrir/nombre_coleccion): son genéricos, no
#     conocen "documento/página"; el resto de retrieval (semantic.py, versions.py) es
#     específico de la Tarea 1 (metadatos documento/versión/página) y NO se reutiliza:
#     aquí los metadatos son ocid/departamento/monto/fecha/categoría/comprador, así que
#     store.py implementa su propia búsqueda exacta por coseno + filtros de metadatos.
# La ruta de import está en src/radar_engine/bootstrap_t1.py (una sola función).
# =============================================================================

embeddings:
  proveedor: local                    # local | openai | gemini (mismas opciones que la Tarea 1)
  batch: 32
  normalizar: true
  local:
    modelo: intfloat/multilingual-e5-small   # el MISMO modelo local que la Tarea 1 (docs/modelos_embeddings.md de la Tarea 1)
    prefijo_consulta: "query: "              # la tarjeta del modelo exige estos prefijos (idéntico a la Tarea 1)
    prefijo_pasaje: "passage: "

indexacion:
  coleccion: radar_procesos           # prefijo del nombre de colección en ChromaDB
  version_esquema: v1                 # cambia si se modifica QUÉ se embebe (ver build_index_radar.py); evita mezclar índices incompatibles
  lote_upsert: 128
  campos_texto: [nomenclatura, descripcion]   # columnas concatenadas para formar el texto que se embebe (nunca se chunkea: una descripción cabe en el límite del modelo)

retrieval:
  top_k: 8
  umbral_similitud: 0.870             # CALIBRADO 2026-09-23 con eval/preguntas_radar.csv y python -m evaluation.sweep_threshold_radar
                                       # (ver data/outputs/barrido_umbral_radar.csv). NO transfiere el 0.835 de la Tarea 1: con ese valor,
                                       # 4/5 preguntas fuera de dominio se respondían indebidamente (sus similitudes van de 0.817 a 0.862,
                                       # casi todas por ENCIMA de 0.835). A 0.870: 0 respuestas indebidas y 5/5 abstenciones correctas fuera
                                       # de dominio, a costa de 2/15 preguntas in_domain que pasan a abstenerse (13/15 respondidas). Ver README "Fase 3".
  busqueda: exacta                    # exacta = coseno contra TODOS los candidatos que pasan los filtros (determinista); ver Tarea 1 para por qué

# ── Filtros numéricos/territoriales extraídos de la pregunta en lenguaje natural ──
# "obras de agua y saneamiento en Cusco por encima de un millón de soles" tiene DOS tipos de
# condición: territorial/numérica (Cusco, > S/ 1 000 000) y semántica (agua y saneamiento).
# Las primeras se aplican como filtro exacto de metadatos (nunca se dejan a la similitud de
# embeddings: un embedding no garantiza "mayor que", ver README "Fase 3, Hybrid RAG"); la
# segunda es la que se compara por coseno. filtros.py hace esta extracción con reglas
# explícitas (no con el LLM: así es gratis, rápida y se puede probar con pytest).
filtros_nl:
  # palabra encontrada en la pregunta -> categoria OCDS (mainProcurementCategory). ORDEN IMPORTA: se busca
  # "services" y "works" ANTES que "goods" a propósito. "goods" tiene las palabras más genéricas (equipo,
  # material...) y esas mismas palabras aparecen todo el tiempo DENTRO de descripciones de servicios u obras
  # ("servicio de alquiler de EQUIPOS", "obra con adquisición de MATERIALES"); si "goods" se revisara primero,
  # esas preguntas se clasificarían mal y se filtrarían contra la categoría equivocada (se detectó con
  # eval/preguntas_radar.csv: la pregunta r05, sobre un SERVICIO de alquiler de laptops, se filtraba como
  # "goods" por la palabra "equipos" y el proceso correcto quedaba fuera de los candidatos).
  categorias:
    services: [servicio, servicios, consultoria, consultoría, mantenimiento, limpieza, vigilancia,
               supervision, supervisión, capacitacion, capacitación, transporte, alquiler]
    works: [obra, obras, construccion, construcción, mejoramiento, ampliacion, ampliación,
            rehabilitacion, rehabilitación, infraestructura, pista, pistas, carretera, puente, puentes,
            saneamiento, pavimentacion, pavimentación]
    goods: [bien, bienes, producto, productos, equipo, equipos, suministro, suministros,
            uniforme, uniformes, material, materiales, mobiliario, insumo, insumos, medicamento, medicamentos]
  monto_mayor: ["mayor a", "mayor que", "superior a", "por encima de", "más de", "arriba de"]
  # "desde" queda fuera a propósito: es ambiguo ("desde 2020" es una fecha, no un monto) y ya sobran frases
  # inequívocas arriba; incluirlo generaría falsos positivos de monto a partir de años.
  monto_menor: ["menor a", "menor que", "inferior a", "por debajo de", "menos de", "hasta"]
  unidades_monto:                     # multiplicador para "un millón", "500 mil", etc.
    millon: 1000000
    millones: 1000000
    mil: 1000
    miles: 1000

llm:
  provider: gemini                    # gemini | anthropic (mismas opciones y mismos .env que la Tarea 1)
  nivel: gratuito
  max_tokens: 1024
  temperatura: 0.0
  timeout_segundos: 60
  limites:
    rpm: 10
    reintentos: 4
    espera_inicial_s: 4
    factor_espera: 2
    espera_max_s: 60
    jitter: 0.25
  proveedores:
    gemini:
      modelo: gemini-3.5-flash-lite
      env_clave: GEMINI_API_KEY
      url_base: https://generativelanguage.googleapis.com/v1beta
      campo_esquema: responseJsonSchema
      temperatura: null
      thinking_level: null
      thinking_budget: null
    anthropic:
      modelo: claude-haiku-4-5-20251001
      env_clave: ANTHROPIC_API_KEY

prompts:
  sistema: |
    Eres un asistente que ayuda a una micro o pequeña empresa peruana a entender QUÉ está
    comprando el Estado, usando ÚNICAMENTE los procesos de contratación recuperados (SEACE V3.0,
    jun-ago 2026).

    REGLAS OBLIGATORIAS
    1. Responde SOLO con los procesos del CONTEXTO. No inventes procesos, montos ni compradores
       que no estén ahí.
    2. Cita el ocid de cada proceso que uses, con el formato [ocid: XXXX].
    3. Si se aplicaron filtros (departamento, monto, fecha, categoría), respeta esos límites:
       nunca menciones un proceso que el propio contexto marque fuera de ellos.
    4. Si el contexto no alcanza para responder con seguridad (pocos procesos, ninguno relevante,
       o la pregunta pide un dato que el contexto no trae), indica contexto_suficiente = false y
       NO inventes una respuesta.
    5. Los montos son referenciales en soles (PEN); acláralo si la pregunta usa otra moneda.
    6. Responde en español claro, apto para el dueño de una micro o pequeña empresa.
  usuario: |
    FILTROS APLICADOS
    {filtros}

    PROCESOS RECUPERADOS
    {contexto}

    PREGUNTA
    {pregunta}
  herramienta_nombre: responder_con_citas_ocid
  herramienta_descripcion: >
    Entrega la respuesta a la pregunta usando solo los procesos del contexto, citando el ocid
    de cada uno en que se apoya, e indica si el contexto fue suficiente.
  etiqueta_proceso: "[ocid: {ocid} | {comprador} | {departamento} | S/ {monto} | {fecha} | {categoria}]"
  herramienta_campos:
    respuesta: "Respuesta a la pregunta, basada solo en el contexto, citando [ocid: XXXX] en cada afirmación."
    citas: "El ocid de cada proceso en que se apoya la respuesta."
    contexto_suficiente: "false si el contexto NO alcanza para responder con seguridad; true en caso contrario."

mensajes:
  abstencion: >
    No encontré procesos de contratación suficientemente parecidos a tu pregunta para responder
    con confianza. Puede que el dato que buscas no esté en los meses indexados (jun-ago 2026) o
    que necesites otros filtros (departamento, monto, categoría).
  abstencion_sin_candidatos: >
    Ningún proceso de los meses indexados cumple los filtros indicados (departamento, monto,
    fecha o categoría). Prueba ampliando el rango.
  error_generico: "Ocurrió un error al generar la respuesta. Intenta de nuevo en un momento."
  indice_faltante: "Falta el índice en {ruta}. Constrúyelo con: python src/build_index_radar.py"

risk:
  min_procesos_adjudicados: 5         # mínimo de procesos adjudicados para entrar en el ranking (evita que 1/1 = 100% domine la tabla); justificado en README Fase 5
  top_n: 10

eval:
  ks: [1, 3, 5]
