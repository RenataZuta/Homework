# =============================================================================
# pricing.yaml — precios usados para calcular el costo de cada llamada
#
# Regla del proyecto: ningún precio se inventa. Cada bloque cita su fuente y la
# fecha en que se verificó. Si un precio es null, el código se niega a calcular
# costos con él (mejor un error que un costo falso).
#
# Estructura por VENTANAS HORARIAS: cada modelo tiene una lista de ventanas
# (zona horaria, hora de inicio, hora de fin, USD por millón de tokens). El
# costo de una llamada usa la ventana que contiene la hora de ESA llamada
# (llm/pricing.py :: precio_en). Esta estructura está probada con una tabla
# ficticia de horas pico y valle en tests/test_pricing.py.
# =============================================================================

anthropic:
  fuente: https://platform.claude.com/docs/en/about-claude/pricing
  fuente_modelos: https://platform.claude.com/docs/en/about-claude/models/overview
  fecha_verificacion: 2026-09-21
  moneda: USD
  unidad: por millón de tokens (MTok)
  nota_horarios: >
    La documentación oficial (verificada en la fecha indicada) publica UN precio por
    modelo y NO menciona tarifas distintas según la hora del día. Por eso cada modelo
    tiene una única ventana 00:00-24:00. Los únicos modificadores documentados son
    ajenos al horario y NO se aplican aquí: Batch API (-50 %), caché de prompts
    (lecturas al 0.1x) y residencia de datos inference_geo "us" (1.1x).
  modelos:
    claude-haiku-4-5-20251001:
      ventanas:
        - zona_horaria: America/Lima
          hora_inicio: "00:00"
          hora_fin: "24:00"
          usd_por_millon_entrada: 1.00
          usd_por_millon_salida: 5.00

# Embeddings por API (comparación de la Fase 6).
openai_embeddings:
  fuente: https://platform.openai.com/docs/pricing            # tabla «Prices per 1M tokens», grupo Embedding
  fuente_modelo: https://platform.openai.com/docs/guides/embeddings
  fecha_verificacion: 2026-09-21
  moneda: USD
  unidad: por millón de tokens de ENTRADA (los embeddings no tienen tokens de salida)
  verificacion_cruzada: >
    La guía oficial de embeddings indica 62 500 páginas por dólar a ~800 tokens por página = 50 M de tokens por dólar = USD 0,02 por millón,
    que coincide con la tabla de precios. La misma guía da 1536 dimensiones por defecto y 8192 tokens de entrada máxima.
  modelos:
    text-embedding-3-small:
      usd_por_millon_tokens: 0.02
      dimensiones: 1536
      max_tokens_entrada: 8192

# ── Google Gemini (proveedor de generación activo desde 2026-09-21) ──────────────────────────────────────────
# En la CAPA GRATUITA el costo real es 0. Estos son los precios del nivel de PAGO estándar: se usan solo como costo de REFERENCIA
# (cuánto costaría el mismo tráfico si algún día se pasara a un plan de pago). llm.nivel en config.yaml decide cuál se cobra de verdad.
gemini:
  fuente: https://ai.google.dev/gemini-api/docs/pricing
  fuente_modelos: https://ai.google.dev/gemini-api/docs/models
  fecha_verificacion: 2026-09-21
  moneda: USD
  unidad: por millón de tokens (MTok), texto, nivel de pago estándar
  nota_nivel_gratuito: >
    La página de precios marca «Free of charge» para gemini-3.5-flash-lite (y para gemini-2.5-flash-lite, aunque la API ya no lo admite en cuentas nuevas) y, en esa columna, «Used to improve our products: Yes»: en la capa
    gratuita Google puede usar el contenido enviado para mejorar sus productos (ver README, sección Privacidad). Los límites de uso
    (RPM/TPM/RPD) NO figuran en la documentación pública: se consultan en https://aistudio.google.com/rate-limit.
  nota_horarios: >
    La página publica UN precio por modelo, sin tarifas por hora; por eso hay una sola ventana 00:00-24:00. La estructura por ventanas se
    conserva y está probada con una tabla ficticia de horas pico y valle. No se aplican descuentos de Batch ni de caché de contexto.
  nota_tokens: >
    Los tokens de razonamiento (thoughtsTokenCount) se suman a los de salida («Output price (including thinking tokens)»). gemini-3.5-flash-lite razona por defecto en nivel «minimal». La entrada de audio tiene otro precio; este proyecto solo envía texto.
  modelos:
    gemini-3.5-flash-lite:                 # modelo ACTIVO. Salida: «Output price (including thinking tokens)»
      ventanas:
        - zona_horaria: America/Lima
          hora_inicio: "00:00"
          hora_fin: "24:00"
          usd_por_millon_entrada: 0.30
          usd_por_millon_salida: 2.50
    gemini-2.5-flash-lite:                 # NO usable con cuentas nuevas (la API lo rechazó el 2026-09-21); se conserva su precio publicado como referencia histórica
      ventanas:
        - zona_horaria: America/Lima
          hora_inicio: "00:00"
          hora_fin: "24:00"
          usd_por_millon_entrada: 0.10
          usd_por_millon_salida: 0.40

# Embeddings por API de Gemini (alternativa gratuita a OpenAI en la comparación de la Fase 6).
gemini_embeddings:
  fuente: https://ai.google.dev/gemini-api/docs/pricing            # sección «Gemini Embedding 2»
  fuente_modelo: https://ai.google.dev/gemini-api/docs/embeddings
  fecha_verificacion: 2026-09-21
  moneda: USD
  unidad: por millón de tokens de ENTRADA de texto (nivel de pago)
  nota_nivel_gratuito: >
    La página marca «Free of charge» para Gemini Embedding 2 (con «Used to improve our products: Yes» en el nivel gratuito). La respuesta de
    embeddings NO informa el número de tokens, por eso el costo de referencia de esta fila no se calcula (no se inventa un conteo).
  modelos:
    gemini-embedding-2:
      usd_por_millon_tokens: 0.20
      dimensiones: 3072              # por defecto; se admite 128-3072 (outputDimensionality); la guía recomienda 768, 1536 o 3072
      max_tokens_entrada: 8192
