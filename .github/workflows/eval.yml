# Evaluación de la recuperación en cada push y pull request (Tarea 1).
# El job FALLA si Recall@3 < eval.min_recall_at_3 (tarea1/config.yaml). NO necesita secretos: no llama a ningún LLM ni a ninguna API de pago;
# el modelo de embeddings es local y el OCR NO corre en CI (el texto procesado, tarea1/data/processed, está versionado).
name: eval

on:
  push:
    paths: ["tarea1/**", ".github/workflows/eval.yml"]
  pull_request:
    paths: ["tarea1/**", ".github/workflows/eval.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recall-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tarea1
    env:
      PYTHONPATH: src
      HF_HOME: ${{ github.workspace }}/.hf_cache          # el modelo de embeddings se descarga aquí y se cachea
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tarea1/requirements-ci.txt

      - name: PyTorch solo CPU (índice oficial de CPU; evita bajar la versión con CUDA)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Dependencias livianas
        run: pip install -r requirements-ci.txt

      - name: Caché del modelo de embeddings
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.hf_cache
          key: hf-${{ runner.os }}-${{ hashFiles('tarea1/config.yaml') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Pruebas unitarias
        run: python -m pytest

      - name: Construir el índice a partir de data/processed (sin OCR)
        run: python scripts/build_index.py

      - name: Evaluar la recuperación (falla si Recall@3 < eval.min_recall_at_3)
        run: python -m evaluation.run_eval

      - name: Subir eval/results como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: tarea1/eval/results/
          if-no-files-found: warn
